<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4ee" />
    <title>RhymePage</title>
    <script>
      /* Paint the saved theme before React mounts so the wrong colours never flash. */
      (function () {
        var legacy = { pastel: "grape", winter: "sky", retro: "lemon", corporate: "sky", business: "night", forest: "mint", harbor: "sky", lilac: "grape", newsprint: "lemon" };
        var known = ["coral", "lemon", "sky", "mint", "grape", "night"];
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        if (saved && known.indexOf(saved) < 0) saved = legacy[saved] || null;
        if (!saved || saved === "auto") {
          saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "coral";
        }
        document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
